<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="Studentstyle.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Student Management System</h1>
        <p>Manage Student Records Easily</p>
    </header>

    <main>

        <!-- Student Form -->
        <section class="form-section">

            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">

                <input type="hidden" id="studentId">

                <div class="form-group">
                    <label>Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Course</label>
                    <input
                        type="text"
                        id="course"
                        placeholder="Enter course"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Marks</label>
                    <input
                        type="number"
                        id="marks"
                        placeholder="Enter marks"
                        min="0"
                        max="100"
                        required
                    >
                </div>

                <button type="submit" id="submitBtn">
                    Add Student
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="cancel-btn"
                    onclick="cancelUpdate()"
                    style="display: none;"
                >
                    Cancel
                </button>

            </form>

        </section>


        <!-- Search -->
        <section class="search-section">

            <h2>Search Student</h2>

            <div class="search-box">

                <input
                    type="number"
                    id="searchId"
                    placeholder="Enter Student ID"
                >

                <button onclick="searchStudent()">
                    Search
                </button>

                <button
                    class="show-btn"
                    onclick="loadStudents()"
                >
                    Show All
                </button>

            </div>

        </section>


        <!-- Student Table -->
        <section class="table-section">

            <h2>Student Records</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Email</th>
                            <th>Marks</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">

                        <!-- JavaScript will add students here -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 Student Management System</p>
    </footer>


    <script src="Studentscript.js"></script>

</body>
</html>
